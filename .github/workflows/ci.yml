# xtest CI.
#
# `finc` comes from the published release, not a source build: this repository
# needs a compiler, not a compiler development environment. The version is
# pinned in FINC_VERSION and the archive's SHA-256 is checked against the
# release index before anything runs.
#
# Every lane compiles *and executes* the self-tests and the example. A lane that
# only type-checked would not have caught the two defects the harness now
# covers, because both are runtime behavior: a null pointer and the bytes an
# XML attribute may contain.
#
# The library is plain libc (`fopen`, `fputs`, `fclose`, `snprintf`, `calloc`,
# `free`) with no POSIX-only call, so all three platforms run the same tests.
# The one platform-conditional check is the `/dev/full` flush-failure probe,
# which the harness enables only on Linux.

name: CI

on:
  push:
    branches: [master, main, production/hardening]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: x86_64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: aarch64
          - runner: macos-15-intel
            os: macos
            arch: x86_64
          - runner: macos-15
            os: macos
            arch: aarch64
          - runner: windows-2025
            os: windows
            arch: x86_64
          - runner: windows-11-arm
            os: windows
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install finc
        run: |
          python3 .github/scripts/install_finc.py --repo-root .
          echo "$PWD/.finc/bin" >> "$GITHUB_PATH"

      - name: finc version
        run: finc --version

      - name: Frontend check (a library has no main, so no link)
        run: |
          finc -I src src/xtest.fin
          finc xtest.fin

      - name: Run the test harness (compiles and executes at -O0 and -O2)
        run: python3 tests/run_tests.py --finc "$PWD/.finc/bin/finc" --fin-libs "$PWD/.finc/lib/std"

      - name: Package install and consumer build through finn
        if: matrix.os == 'linux' && matrix.arch == 'x86_64'
        run: |
          # A package that cannot be consumed is not a package. Install finn from
          # its published release and prove `finn add` + `finn build` + run.
          curl -fsSL -o finn.tar.gz https://github.com/M1778/finn/releases/download/v1.0.1/finn-linux-x86_64.tar.gz
          curl -fsSL -o finn.sha256 https://github.com/M1778/finn/releases/download/v1.0.1/finn-linux-x86_64.tar.gz.sha256
          echo "$(cat finn.sha256)  finn.tar.gz" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/finn-bin"
          tar xzf finn.tar.gz -C "$RUNNER_TEMP/finn-bin"
          chmod +x "$RUNNER_TEMP/finn-bin/finn"
          export PATH="$RUNNER_TEMP/finn-bin:$PATH"
          export FIN_COMPILER_PATH="$PWD/.finc/bin/finc"
          finn --version

          consumer="$RUNNER_TEMP/xtest-consumer"
          mkdir -p "$consumer/src"
          cd "$consumer"
          cat > finn.toml <<'TOML'
          [project]
          name = "consumer"
          version = "0.1.0"
          envpath = ".finn"
          entrypoint = "main.fin"

          [packages]

          [scripts]
          TOML
          cat > src/main.fin <<'FIN'
          import { TestStats, xtest_new, xtest_case, xtest_check_eq_int,
                   xtest_summary, xtest_junit, xtest_free } from xtest::fin;
          #[llvm_name="exit"]
          @define con_exit(code: int) <noret>;
          fun main() <noret> {
              let s <TestStats> = xtest_new("consumer");
              xtest_case(&s, "math");
              xtest_check_eq_int(&s, 2 + 2, 4, "addition");
              let code <int> = xtest_summary(&s);
              let report <int> = xtest_junit(&s, "junit-consumer.xml");
              xtest_free(&s);
              if (code != 0 || report != 0) { con_exit(1); }
          }
          FIN
          finn add "$GITHUB_WORKSPACE" --yes
          finn build
          ./out/consumer
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("junit-consumer.xml").getroot()
          assert root.attrib["tests"] == "1", root.attrib
          assert root.attrib["failures"] == "0", root.attrib
          assert root[0].attrib["name"] == "math", root[0].attrib
          print("consumer report parsed:", root.attrib)
          PY

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            **/junit*.xml
          if-no-files-found: warn
